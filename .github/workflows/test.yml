name: test

on:
  push:
  pull_request:

concurrency:
  group: air-monitor-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s tests -v
      - run: python cli.py sample/readings.jsonl --lat 24.1477 --lon 120.6736 --now 2026-10-05T08:00:00+00:00
